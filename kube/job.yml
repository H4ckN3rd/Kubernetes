kind: Job
apiVersion: batch/v1
metadata:
  name: demo-job
  namespace: nginx
spec:
  completions: 1
  parallelism: 2
  template:
    metadata:
      name: demo-job-pod
      labels:
        app: batch-task

    spec:
      containers:
      - name: batch-completions
        image: busybox:latest
        command: ["sh", "-c", "echo hello && sleep 10s"]
      restartPolicy: Never